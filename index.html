/* roue mignonne */
.wst{background:radial-gradient(circle at 20% 10%,#FFE3F0,transparent 55%),radial-gradient(circle at 90% 90%,#D9F5FF,transparent 55%),linear-gradient(160deg,#FFF1F7,#EEE6FF 55%,#E3F9F0);box-shadow:0 10px 30px rgba(212,83,126,.22),inset 0 0 0 3px #fff}

.wbl circle{transform-box:fill-box;transform-origin:center}
.wgo{color:#fff;font:600 19px Fredoka,system-ui,sans-serif;letter-spacing:.3px;background:linear-gradient(135deg,#FF7FAA,#D4537E);box-shadow:0 5px 0 #A83562,0 10px 20px rgba(212,83,126,.35),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 1px 0 rgba(0,0,0,.15)}

.wti{color:#C8467A;text-shadow:none}

/* roue sobre, comme les autres pages */
.wst{background:var(--card);box-shadow:var(--sh)}
.wrays,.wsp{display:none}

const MKH=n=>{n=Math.imul((n^61)^(n>>>16),9)>>>0;n=Math.imul(n^(n>>>4),0x27d4eb2d)>>>0;return (n^(n>>>15))>>>0};

window.pkAdd=(k,n)=>{pk()[k]=(pk()[k]||0)+n};
window.pkN=()=>K.reduce((a,k)=>a+(pk()[k]||0),0);
window.pkTog=()=>{S.pkKeep=!S.pkKeep;save();sfx('pop');draw()};
window.pkTogH=()=>'<div class="card" style="margin:6px 0"><div class="row"><div><b>Après l\'achat</b><div class="mut" style="font-size:12px">'+(S.pkKeep?'Les packs vont dans Gummies → Packs':'Le pack s\'ouvre tout de suite')+'</div></div><button class="'+(S.pkKeep?'':'g')+'" style="margin:0" onclick="pkTog()">'+(S.pkKeep?'Garder 📦':'Ouvrir ✨')+'</button></div></div>';
const ic=k=>k[0]=='n'?bpPack(+k[1],34):k[0]=='x'?xbear(0,38):bear(evid(),38);
const nt=k=>k[0]=='x'?'Gummies de Noël, non échangeables':k[0]=='r'?'Donne accès au Royal de la semaine en cours':'1 gummy au hasard';
window.pkView=()=>{let h='<h2>Mes packs</h2><p class="mut">Garde tes packs et ouvre-les quand tu veux. '+(S.pkKeep?'Mode actuel : tes achats sont gardés ici.':'Mode actuel : tes achats s\'ouvrent tout de suite.')+'</p><div class="card"><div class="row"><b>Après l\'achat</b><button class="'+(S.pkKeep?'':'g')+'" style="margin:0" onclick="pkTog()">'+(S.pkKeep?'Garder 📦':'Ouvrir ✨')+'</button></div></div>';
 const tot=pkN();if(!tot)h+='<div class="card" style="text-align:center"><p class="mut">Aucun pack pour l\'instant. Les récompenses du Pass et des coffres arrivent ici, et tes achats aussi si tu choisis « Garder ».</p></div>';
 else{h+='<div class="row" style="margin:6px 0"><b>'+tot+' pack'+(tot>1?'s':'')+'</b><button style="margin:0" onclick="pkAll()">Tout ouvrir</button></div>';
  K.forEach(k=>{const c=pk()[k]||0;if(!c)return;h+='<div class="card" style="margin-bottom:8px"><div class="row"><div style="display:flex;gap:10px;align-items:center">'+ic(k)+'<div><b>'+NM[k]+'</b><div class="mut" style="font-size:12px">'+nt(k)+'</div></div></div><b style="font-size:20px">×'+c+'</b></div><div style="display:flex;gap:6px;margin-top:8px"><button style="flex:1;margin:0" onclick="pk1(\''+k+'\')">Ouvrir 1</button><button class="g" style="flex:1;margin:0" '+(c>=5?'':'disabled')+' onclick="pkBulk(\''+k+'\',5)">Ouvrir 5</button><button class="g" style="flex:1;margin:0" '+(c>1?'':'disabled')+' onclick="pkBulk(\''+k+'\','+c+')">Tout ('+c+')</button></div></div>'})}
 return h};
window.pk1=k=>{if(!(pk()[k]>0))return;pk()[k]--;save();const n=+k[1];if(k[0]=='n')pack2(n,true);else if(k[0]=='x')xpack(true,n);else evOpen(false,false,n,true)};
function rollOne(k,res,ow){const n=+k[1];
 if(k[0]=='n'){const q=packRoll(n),nw=S.packs<=5,id=pkId(q,nw,res.map(x=>[x.id]),ow);const isN=!ow.includes(id);add(id,q);S.packs++;bpx(25);qinc('pack');if(isN)qinc('new',1);ow.push(id);res.push({id,q,nw:isN})}
 else if(k[0]=='x'){xi();for(let m=0;m<n;m++){const q=Math.min(4,roll(false)),id=pick(XRP[q]),isN=xbest(id)<0;const kk=id+'.'+q;S.xm[kk]=(S.xm[kk]||0)+1;res.push({id,q,nw:isN,x:1})}}
 else{jl();let wins=0;for(let m=0;m<n;m++)if(Math.random()<EV.c)wins++;wins=Math.min(wins,Math.max(0,EV.t-S.evn));for(let m=0;m<n;m++){if(m<wins){const id=evid();S.evn++;const num=S.evn;S.evl.push(num);S.evh.push({id,n:num,t:EV.t});add(id,RAR[id]);res.push({id,q:6,nw:!ow.includes(id),roy:1,num});ow.push(id)}else{const q=packRoll(2),id=pkId(q,false,res.map(x=>[x.id]),ow),isN=!ow.includes(id);add(id,q);res.push({id,q,nw:isN});ow.push(id)}}S.packs++;bpx(25);qinc('pack')}}
function show(res,count){const nwc=res.filter(x=>x.nw).length,roy=res.filter(x=>x.roy).length;const cnt=[0,0,0,0,0,0,0];res.forEach(x=>cnt[x.q]++);
 const top=res.slice().sort((a,b)=>b.q-a.q||(b.nw?1:0)-(a.nw?1:0)).slice(0,30);
 ov('<h2>'+count+' pack'+(count>1?'s':'')+' ouvert'+(count>1?'s':'')+'</h2><p class="mut">'+res.length+' gummies · <b>'+nwc+' nouveau'+(nwc>1?'x':'')+'</b>'+(roy?' · <b style="color:'+RH[6]+'">'+roy+' Royal !</b>':'')+'</p><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:8px">'+cnt.map((c,i)=>c?'<span class="chipm" style="border-color:'+RH[i]+';margin:0">'+RN[i]+' ×'+c+'</span>':'').join('')+'</div><div class="grid" style="max-height:44vh;overflow:auto">'+top.map(x=>'<div class="gm" style="border-color:'+RH[x.q]+'">'+(x.nw?'<span class="lv">Nouveau</span>':'')+(x.x?xbear(x.id,44):bear(x.id,44))+'<div>'+(x.x?xnm(x.id):nm(x.id))+'</div></div>').join('')+'</div>'+(res.length>30?'<p class="mut" style="font-size:12px">Les 30 meilleurs gummies sont affichés. Les autres sont dans ta collection.</p>':'')+'<button style="width:100%;margin-top:8px" onclick="ov()">Super</button>',roy?5:nwc?3:2);
 sfx(roy?'rare':'new')}
window.pkBulk=(k,c)=>{c=Math.min(c,pk()[k]||0);if(c<1)return;if(c==1)return pk1(k);const res=[],ow=owned().slice();pk()[k]-=c;for(let i=0;i<c;i++)rollOne(k,res,ow);save();show(res,c);draw()};
window.pkAll=()=>{const tot=pkN();if(!tot)return;if(tot==1){const k=K.find(x=>pk()[x]>0);return pk1(k)}const res=[],ow=owned().slice();let c=0;K.forEach(k=>{const m=pk()[k]||0;for(let i=0;i<m;i++){rollOne(k,res,ow);c++}pk()[k]=0});save();show(res,c);draw()};
})();
</script></body></html>
